data:
  train_files: data/search_r1_sft/train.parquet
  val_files: data/search_r1_sft/validation.parquet
  prompt_key: messages
  response_key: null
  prompt_dict_keys: null
  response_dict_keys: null
  max_length: 2048
  truncation: right
  train_batch_size: 24
  micro_batch_size: 3
  balance_dp_token: false
  chat_template: null
  # Avoid CUDA-context inheritance from forked DataLoader workers under FSDP.
  num_workers: 0

model:
  partial_pretrain: models/Qwen2.5-3B-Instruct
  attn_implementation: sdpa
  enable_gradient_checkpointing: true
  trust_remote_code: false
  external_lib: null
  lora_rank: 0
  lora_alpha: 16
  target_modules: [q_proj, v_proj]
  fsdp_config:
    wrap_policy:
      min_num_params: 0
    cpu_offload: false
    offload_params: false

optim:
  lr: 2.0e-6
  betas: [0.9, 0.95]
  weight_decay: 0.01
  warmup_steps_ratio: 0.03
  clip_grad: 1.0

trainer:
  total_epochs: 1
  total_training_steps: null
  validate_before_training: true
  validation_freq: 50
  save_freq: 50
  log_freq: 1
  project_name: TraceCredit-RL
  experiment_name: singlehopqa-sft-search-r1-qwen2.5-3b-instruct
  default_local_dir: verl_checkpoints/singlehopqa-sft-search-r1-qwen2.5-3b-instruct
  default_hdfs_dir: null
  logger: [console, wandb]
  resume_path: null
  seed: 42
